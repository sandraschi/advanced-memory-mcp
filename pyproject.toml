[project]
name = "advanced-memory"
version = "1.3.0"
description = "Comprehensive research and knowledge platform with web search, GitHub trawling, arXiv academic research, TV Tropes narrative analysis, document ingestion, RAG vector search, and research-driven skill creation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Advanced Memory Community", email = "hello@advanced-memory.com" }
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "pydantic[email,timezone]>=2.10.3",
    "icecream>=2.1.3",
    "mcp>=1.2.0",
    "pydantic-settings>=2.6.1",
    "loguru>=0.7.3",
    "pyright>=1.1.390",
    "markdown-it-py>=3.0.0",
    "python-frontmatter>=1.1.0",
    "rich>=13.9.4",
    "unidecode>=1.3.8",
    "dateparser>=1.2.0",
    "watchfiles>=1.0.4",
    "fastapi[standard]>=0.115.8",
    "alembic>=1.14.1",
    "pillow>=11.1.0",
    "pybars3>=0.9.7",
    "fastmcp>=2.14.3,<3.0.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.0",
    "pytest-aio>=1.9.0",
    "markdown>=3.9",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-markdown>=3.9.0.20250906",
    "defusedxml>=0.7.1",
    "starlette>=0.47.2",
    "regex>=2025.2.10",
    "pypandoc>=1.13",
    "fpdf2>=2.7.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "gitpython>=3.1.40",
    "wikipedia-api>=0.6.0",
    "arxiv>=2.1.0",
    "pypdf>=3.17.0",
    "pdfplumber>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pathspec>=0.12.0",  # .gitignore pattern matching for repo export
    "aiohttp>=3.9.0",     # Async HTTP for web research
    "chromadb>=0.4.0",    # Vector database for RAG
    "sentence-transformers>=2.2.0",  # Text embeddings
    "PyMuPDF>=1.23.0",    # PDF text extraction for research
]

[project.optional-dependencies]
voice = [
    "kokoro>=0.9.4",             # Soulful Text-to-speech (speak)
    "faster-whisper>=1.2.1",     # High-performance Speech-to-text (dictate)
    "onnxruntime-gpu>=1.23.2",   # GPU acceleration for STT/TTS
    "sounddevice>=0.5.2",        # Audio recording
    "soundfile>=0.13.1",         # Audio file handling
    "numpy>=1.26.4",             # Array processing
]
plex = [
    "plexapi>=4.15.0",    # Plex Media Server API (music control)
]

[project.urls]
Homepage = "https://github.com/sandraschi/advanced-memory-mcp"
Repository = "https://github.com/sandraschi/advanced-memory-mcp"
Documentation = "https://github.com/sandraschi/advanced-memory-mcp#readme"

[project.scripts]
advanced-memory = "advanced_memory.cli.main:app"
am = "advanced_memory.cli.main:app"
release = "scripts.release:main"
am-skill-creator = "advanced_memory.services.skill_creator.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "-v -s"
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:.*datetime.datetime.utcnow",
    "ignore::DeprecationWarning:.*datetime adapter",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::RuntimeWarning:.*coroutine.*was never awaited",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "mcpb", "dist", "htmlcov"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise without from in except clause (intentional in some error handlers)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # Allow imports after code in __init__.py files
"src/advanced_memory/mcp/mcp_instance.py" = ["E402"]  # Logger setup before imports
"src/advanced_memory/mcp/server.py" = ["E402", "F811"]  # Logger setup before imports
"src/advanced_memory/services/initialization.py" = ["E402"]  # Conditional logger/db imports
"tests/**" = ["F841"]  # Unused result in tests (assertions on side effects)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
dev-dependencies = [
    "gevent>=24.11.1",
    "icecream>=2.1.3",
    "pytest>=8.3.4",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.1.6",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.6.0",
    "types-setuptools>=69.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "detect-secrets>=1.5.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_memory"]

[tool.hatch.build.targets.wheel.force-include]
"zettelkasten" = "advanced_memory/zettelkasten"

[tool.pyright]
include = ["src/"]
exclude = ["**/__pycache__"]
ignore = ["test/"]
defineConstant = { DEBUG = true }
reportMissingImports = "error"
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "fastmcp.*",
    "uv.*",
    "mcp.*",
    "watchfiles.*",
    "rich.*",
    "typer.*",
    "loguru.*",
    "pydantic.*",
    "sqlalchemy.*",
    "aiosqlite.*",
    "markdown_it.*",
    "frontmatter.*",
    "unidecode.*",
    "dateparser.*",
    "pillow.*",
    "pybars3.*",
    "pyjwt.*",
    "dotenv.*",
    "pytest.*",
    "bandit.*",
    "safety.*",
    "semgrep.*",
]
ignore_missing_imports = true



[tool.coverage.run]
concurrency = ["thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Exclude specific modules that are difficult to test comprehensively
omit = [
    "*/external_auth_provider.py",  # External HTTP calls to OAuth providers
    "*/supabase_auth_provider.py",  # External HTTP calls to Supabase APIs
    "*/watch_service.py",           # File system watching - complex integration testing
    "*/background_sync.py",         # Background processes
    "*/cli/main.py",               # CLI entry point
    "*/services/migration_service.py", # Complex migration scenarios
]

[tool.logfire]
ignore_no_config = true
