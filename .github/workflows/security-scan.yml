name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 3 AM UTC
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
        continue-on-error: true

      # Note: SARIF upload requires GitHub Advanced Security
      # Saving results as JSON artifact instead

      - name: Run Bandit security linter
        run: |
          if command -v bandit >/dev/null 2>&1; then
            uv run bandit -r src/ -f json -o bandit-results.json || echo "Bandit scan completed with warnings"
          else
            echo "Bandit not available, skipping security scan"
          fi
        continue-on-error: true

      - name: Run Safety scan
        run: |
          if command -v safety >/dev/null 2>&1; then
            uv run safety scan --output json --save-as safety-results.json || echo "Safety scan completed with warnings"
          else
            echo "Safety not available, skipping dependency scan"
          fi
        continue-on-error: true

      - name: Run Semgrep
        if: env.SEMGREP_APP_TOKEN != ''
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-results.json
            safety-results.json
            trivy-results.json

