# Advanced Memory MCP Pre-Commit Hooks
# Runs automatically before every commit to catch issues early
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # MyPy - Type checking (run manually: SKIP= ruff pre-commit run mypy --all-files)
  # Disabled on commit due to many pre-existing type errors; fix incrementally
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        stages: [manual]
        args: [src, --ignore-missing-imports, --explicit-package-bases]
        additional_dependencies: [types-setuptools]
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: node_modules|webapp/node_modules|skill-zips|memory\.json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^docs/github/PRE_COMMIT_HOOKS_GUIDE\.md$
      - id: mixed-line-ending
      # Additional file quality checks
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      # Skip on commit: Windows doesn't set executable bit; run manually on Unix
      - id: check-shebang-scripts-are-executable
        stages: [manual]
        exclude: ^(node_modules|webapp/node_modules)/
      - id: fix-byte-order-marker

  # Security - Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Run manually: pre-commit run detect-secrets --all-files
      - id: detect-secrets
        stages: [manual]
        args: ['--baseline', '.secrets.baseline']
        exclude: (uv\.lock|\.secrets\.baseline|node_modules|skill-zips|alembic/versions)$

  # Conventional Commits - Enforce commit message format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

# Configuration
default_stages: [pre-commit]
fail_fast: false
