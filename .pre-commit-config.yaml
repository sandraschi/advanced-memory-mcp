repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [ --fix ]
        exclude: ^(mcpb|native|scripts)/   # packaging copy + excluded dirs (see pyproject [tool.ruff] exclude)
      - id: ruff-format
        exclude: ^(mcpb|native|scripts)/

  - repo: local
    hooks:
      - id: biome-check
        name: Biome (JS/TS lint + format)
        language: system
        entry: npx biome check --write
        files: \.(js|jsx|ts|tsx|json)$
        pass_filenames: true
        args: []